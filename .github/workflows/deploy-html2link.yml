name: deploy-html2link

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy html2link container on shared VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="$HOME/html2link"
            ENV_FILE="$APP_DIR/.env.production"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/joohw/html2link.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            umask 077
            AUTH_SECRET_VALUE=""
            if [ -f "$ENV_FILE" ]; then
              AUTH_SECRET_VALUE="$(grep '^AUTH_SECRET=' "$ENV_FILE" | head -n1 | cut -d= -f2- || true)"
            fi
            if [ -z "$AUTH_SECRET_VALUE" ]; then
              AUTH_SECRET_VALUE="$(openssl rand -base64 32)"
            fi

            cat > "$ENV_FILE" <<EOF
            NODE_ENV=production
            NEXT_PUBLIC_APP_URL=https://html2link.dev
            AUTH_SECRET=$AUTH_SECRET_VALUE
            NEXTAUTH_URL=https://html2link.dev
            CLOUDFLARE_ACCOUNT_ID=$R2_ACCOUNT_ID
            HTML2LINK_CLOUDFLARE_ACCOUNT_ID=$R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
            HTML2LINK_R2_BUCKET=html2link
            HTML2LINK_R2_PUBLIC_BASE_URL=https://html2link.dev
            HTML2LINK_MAX_UPLOAD_BYTES=20971520
            EOF
            chmod 600 "$ENV_FILE"

            docker build -t html2link:latest .
            docker rm -f html2link >/dev/null 2>&1 || true
            docker run -d \
              --name html2link \
              --restart unless-stopped \
              -p 127.0.0.1:39173:3000 \
              --env-file "$ENV_FILE" \
              html2link:latest

            docker ps --filter name=html2link
            curl -fsS http://127.0.0.1:39173 >/dev/null
            printf '<h1>html2link deploy smoke</h1>' >/tmp/html2link-smoke.html
            curl -fsS -F 'file=@/tmp/html2link-smoke.html' http://127.0.0.1:39173/api/upload | python3 -c 'import sys,json; data=json.load(sys.stdin); print(data.get("url", "missing-url"))'
