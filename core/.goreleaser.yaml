version: 2

project_name: clovapi

dist: dist

before:
  hooks:
    - go mod tidy

builds:
  - id: clovapi
    main: ./cmd/clovapi
    binary: clovapi
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/clovapi/switcher/internal/buildinfo.Version={{.Version}}
      - -X github.com/clovapi/switcher/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/clovapi/switcher/internal/buildinfo.Date={{.Date}}

archives:
  - id: default
    builds:
      - clovapi
    name_template: "clovapi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
