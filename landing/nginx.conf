server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 308 /zh-CN; }
    location = /about { return 308 /zh-CN/about; }
    location = /privacy { return 308 /zh-CN/privacy; }
    location = /docs { return 308 /zh-CN/docs; }
    location = /pricing { return 308 /zh-CN; }
    location = /models { return 308 /zh-CN/models; }
    location = /personal { return 308 /zh-CN; }
    location = /apikeys { return 308 /zh-CN; }
    location = /token { return 307 /zh-CN; }
    location = /dashboard/token { return 307 /zh-CN; }
    location = /dashboard { return 308 /zh-CN; }
    location = /blog { return 308 /zh-CN/blog; }
    location = /guides { return 308 /zh-CN/blog; }
    location = /skill { return 308 /zh-CN/skill; }

    location ~ ^/docs/(.*)$ { return 308 /zh-CN/docs/$1; }
    location ~ ^/dashboard/(.*)$ { return 308 /zh-CN; }
    location ~ ^/blog/(.*)$ { return 308 /zh-CN/blog/$1; }
    location ~ ^/guides/(.*)$ { return 308 /zh-CN/blog/$1; }

    location = /api/docs-search {
        default_type application/json;
        try_files $uri =404;
    }

    location = /api/skill-md {
        default_type text/markdown;
        try_files $uri =404;
    }

    location = /skill.md {
        default_type text/markdown;
        try_files $uri =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
