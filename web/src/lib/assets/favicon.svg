<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <title>favicon</title>
  <!-- 最外一圈保持黑色；蛇与食物整体内缩 1 格 -->
  <rect width="16" height="16" fill="#000000"/>
  <g fill="#ffffff">
    <rect x="1" y="4" width="3" height="11"/>
    <rect x="1" y="12" width="14" height="3"/>
    <rect x="12" y="1" width="3" height="14"/>
    <rect x="1" y="1" width="9" height="3"/>
    <rect x="10" y="1" width="2" height="2"/>
    <!-- 内侧弯月（像素块） -->
    <rect x="6" y="4" width="3" height="1"/>
    <rect x="5" y="5" width="2" height="1"/>
    <rect x="5" y="6" width="1" height="3"/>
    <rect x="5" y="9" width="2" height="1"/>
    <rect x="6" y="10" width="3" height="1"/>
  </g>
</svg>
